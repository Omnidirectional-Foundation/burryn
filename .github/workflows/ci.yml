# L0 births gen1 as a tool (C midwife, not the CI product).
# L0 接生 gen1 当工具（C 只接生，不是 CI 产物）。
# bur-base is minted once per seed/go-host SHA at CC_OPT=-O1, fingerprinted,
# and reused. Cache is a shortcut; identity is go-host SHA + sha256.
# bur-base 按 seed/go-host SHA、CC_OPT=-O1 接生一次并打指纹后复用。
# cache 是捷径，身份是 go-host SHA + sha256。
# gen1 is born every push from current compiler/. Verify jobs download gen1.
# gen1 每个 push 从当前 compiler/ 接生。验证 job 下载 gen1。
# The C three-gen fixpoint runs on push: it is the only check that catches
# nondeterminism and runtime-state defects the behaviour suites cannot see.
# C 三代定点进每次 push：行为套件看不见的不确定性与运行时状态缺陷，只有它能抓。
# Linux x86 ELF parity runs on push in the multibackend job: VM / C / x86
# stdout + exit code agreement via scripts/multi-backend-verify.sh.
# Linux x86 ELF 对照进每次 push（三方 stdout + exit code 一致）。
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gohost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gohost.outputs.sha }}
      hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout Go seed
        uses: actions/checkout@v4
        with:
          ref: seed/go-host
          path: _go-host

      - name: go-host SHA
        id: gohost
        run: echo "sha=$(git -C _go-host rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Probe bur-base cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: bur-base
          key: bur-base-${{ steps.gohost.outputs.sha }}-O1
          lookup-only: true

  seed:
    needs: gohost
    if: needs.gohost.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Go seed
        uses: actions/checkout@v4
        with:
          ref: seed/go-host
          path: _go-host

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: _go-host/go.mod
          cache: false

      - name: Build bur-seed
        run: |
          set -euo pipefail
          rm -f _go-host/program.c
          (cd _go-host && go build -o "$GITHUB_WORKSPACE/bur-seed" .)

      - name: Upload bur-seed
        uses: actions/upload-artifact@v4
        with:
          name: bur-seed
          path: bur-seed
          if-no-files-found: error
          retention-days: 3

  bur-base:
    needs: [gohost, seed]
    if: |
      always() &&
      needs.gohost.result == 'success' &&
      (needs.seed.result == 'success' || needs.seed.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Go seed
        uses: actions/checkout@v4
        with:
          ref: seed/go-host
          path: _go-host

      - name: Restore bur-base
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: bur-base
          key: bur-base-${{ needs.gohost.outputs.sha }}-O1

      - name: Download bur-seed
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: bur-seed

      - name: Build bur-base
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CC_OPT: "-O1"
        run: |
          set -euo pipefail
          chmod +x bur-seed
          echo "go-host ${{ needs.gohost.outputs.sha }}"
          cc --version | head -n 1
          echo "CC_OPT=$CC_OPT"
          touch /tmp/bb-alive
          (
            while [ -f /tmp/bb-alive ]; do
              sleep 45
              echo "[bur-base still running $(date -u +%H:%M:%S)]"
            done
          ) &
          echo $! > /tmp/bb-hb.pid
          (cd _go-host && "$GITHUB_WORKSPACE/bur-seed" build burc -o "$GITHUB_WORKSPACE/bur-base")
          rm -f /tmp/bb-alive
          wait "$(cat /tmp/bb-hb.pid)" 2>/dev/null || true

      - name: Fingerprint bur-base
        run: |
          set -euo pipefail
          chmod +x bur-base
          echo "go-host ${{ needs.gohost.outputs.sha }}"
          echo "CC_OPT=-O1"
          cc --version | head -n 1
          sha256sum bur-base | tee bur-base.sha256

      - name: Save bur-base cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bur-base
          key: bur-base-${{ needs.gohost.outputs.sha }}-O1

      - name: Upload bur-base
        uses: actions/upload-artifact@v4
        with:
          name: bur-base
          path: |
            bur-base
            bur-base.sha256
          if-no-files-found: error
          retention-days: 14

  gen1:
    needs: bur-base
    if: always() && needs['bur-base'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang
      CC_OPT: -O1
      MALLOC_ARENA_MAX: "2"
    steps:
      - name: Create swap
        run: |
          set -euo pipefail
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bur-base
        uses: actions/download-artifact@v4
        with:
          name: bur-base

      - name: Checkout Go seed runtime
        uses: actions/checkout@v4
        with:
          ref: seed/go-host
          path: _go-host

      - name: Birth gen1
        run: |
          set -euo pipefail
          chmod +x bur-base
          cp _go-host/runtime/burrt.h runtime/burrt.h
          cp _go-host/runtime/burrt_natives.h runtime/burrt_natives.h
          rm -f program.c
          ./bur-base build compiler -o gen1
          git checkout -- runtime/burrt.h runtime/burrt_natives.h

      - name: Upload gen1
        uses: actions/upload-artifact@v4
        with:
          name: gen1
          path: gen1
          if-no-files-found: error
          retention-days: 7


  check:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: fmt and typecheck
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 fmt --check compiler
          ./gen1 check compiler

      - name: std embed table matches std sources
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 dev embed-std .
          git diff --exit-code compiler/lib/std_embed.bur

      # ud2 may only be constructed inside guarded_ud2 (pe.bur) and the
      # dispatch-chain default (dispatch_chain.bur). A bare ud2 anywhere else
      # is one missing jmp away from a fallthrough-into-trap (rounds 10-16);
      # new arms must route through the constructor.
      - name: no bare ud2 emission
        run: |
          set -euo pipefail
          bad=$(grep -rn 'e1(15) + e1(11)' compiler/backends/x86/ \
            | grep -v '^\s*//' \
            | grep -v 'jmp_rel32(2) + e1(15) + e1(11)' \
            | grep -v 'default_case = e1(15) + e1(11)' \
            || true)
          if [ -n "$bad" ]; then
            echo "bare ud2 outside guarded constructors:"
            echo "$bad"
            exit 1
          fi

  fixpoint:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang
      CC_OPT: -O1
      MALLOC_ARENA_MAX: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: Three-generation fixpoint
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 build compiler -o g1c
          ./g1c build compiler -o g2c
          sha256sum g1c g2c
          cmp g1c g2c

  llvm-fixpoint:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang
      CC_OPT: -O1
      MALLOC_ARENA_MAX: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      # S8.8：LLVM 后端自举链——gen1（C 自举）经 llvm 后端编出编译器，再用它
      # 把编译器再编一遍，两次产物逐字节相同
      # S8.8: the LLVM backend self-chain — gen1 (C-built) compiles the
      # compiler through the LLVM backend, then that compiler compiles the
      # compiler again; both artifacts must be byte-identical
      - name: LLVM three-generation fixpoint
        run: |
          set -euo pipefail
          chmod +x gen1
          clang --version | head -n 1
          ./gen1 build --backend llvm compiler -o g1llvm
          ./g1llvm build --backend llvm compiler -o g2llvm
          sha256sum g1llvm g2llvm
          cmp g1llvm g2llvm

  x86-fixpoint:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MALLOC_ARENA_MAX: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      # x86 后端自举链——gen1（C 自举）经 x86 后端编出编译器，再用它把编译器
      # 再编一遍，两次产物逐字节相同。多遍暖机 + 三段 list 化之后首次可行。
      # the x86 backend self-chain — gen1 (C-built) compiles the compiler
      # through the x86 backend, then that compiler compiles the compiler
      # again; both artifacts must be byte-identical. First feasible after the
      # multi-pass warmup and the list-based segment assembly.
      - name: x86 three-generation fixpoint
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 build --backend x86 compiler -o g1x
          ./g1x build --backend x86 compiler -o g2x
          sha256sum g1x g2x
          cmp g1x g2x

  testdata:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: testdata-verify
        run: |
          set -euo pipefail
          chmod +x gen1
          mv gen1 bur
          BUR=./bur SKIP_FIXPOINT=1 ./scripts/testdata-verify.sh

  examples:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: examples-verify
        run: |
          set -euo pipefail
          chmod +x gen1
          mv gen1 bur
          BUR=./bur ./scripts/examples-verify.sh

  std:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: std tests
        run: |
          set -euo pipefail
          chmod +x gen1
          for p in cli crypto encoding json log net path regex testing; do
            ./gen1 test "std/$p"
          done

  lsp:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: lsp-verify
        run: |
          set -euo pipefail
          chmod +x gen1
          BUR=./gen1 ./scripts/lsp-verify.sh

  multibackend:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: multi-backend-verify
        run: |
          set -euo pipefail
          chmod +x gen1
          mv gen1 bur
          BUR=./bur ./scripts/multi-backend-verify.sh

      # fd 上限压到只够 0/1/2（及 1、2 个 pipe），逐级触发 exec 的 pipe 失败回收路径
      # Cap the fd limit so the first, second and third pipe each fail in turn,
      # driving every level of exec's pipe-failure unwind
      - name: x86 exec pipe-failure unwind
        run: |
          set -euo pipefail
          ./bur build --backend x86 examples/io/exec.bur -o exec_x86
          for n in 4 5 7; do
            out=$(ulimit -n "$n"; ./exec_x86)
            grep -q '^echo: Err: ' <<<"$out"
          done

      # PIE：两次启动的首条映射（代码段）基址都不得等于链接基址 0x400000，且彼此不同
      # PIE: across two launches the first mapping's (code segment) base must
      # differ from the link base 0x400000 and from each other
      - name: x86 PIE image base
        run: |
          set -euo pipefail
          ./bur build --backend x86 testdata/pie/spin.bur -o spin_x86
          bases=""
          for i in 1 2; do
            ./spin_x86 & pid=$!
            sleep 0.5
            b=$(head -1 "/proc/$pid/maps" | cut -d- -f1)
            kill -9 "$pid"
            echo "code base 0x$b"
            if [ "$((16#$b))" -eq 4194304 ]; then echo "image not relocated"; exit 1; fi
            bases="$bases $b"
          done
          set -- $bases
          if [ "$1" = "$2" ]; then echo "same base across launches"; exit 1; fi

  x86-repro:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      # x86 artifact reproducibility, not the C three-generation fixpoint:
      # there is no x86 self-chain. The same compiler building the same
      # source twice must emit byte-identical output (no timestamps,
      # no hash-order leaks in the serializers).
      - name: Build each target twice and compare
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 build --backend x86 examples/basics/hello.bur -o elf-a
          ./gen1 build --backend x86 examples/basics/hello.bur -o elf-b
          cmp elf-a elf-b
          ./gen1 build --backend x86 --os windows examples/basics/hello.bur -o pe-a.exe
          ./gen1 build --backend x86 --os windows examples/basics/hello.bur -o pe-b.exe
          cmp pe-a.exe pe-b.exe
          ./gen1 build --backend x86 --os darwin examples/basics/hello.bur -o macho-a
          ./gen1 build --backend x86 --os darwin examples/basics/hello.bur -o macho-b
          cmp macho-a macho-b

  llvm:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      # S8.8：LLVM 后端语料对照同机 C 后端（stdout + 退出码逐例一致）
      # S8.8: the LLVM backend corpus against the same machine's C backend
      # (stdout and exit code must match case by case)
      - name: LLVM backend corpus vs C (hard gate)
        run: |
          set -euo pipefail
          chmod +x gen1
          clang --version | head -n 1
          pass=0; fail=0
          for f in examples/basics/hello.bur examples/basics/fib.bur \
                   examples/basics/float_arith.bur examples/concurrency/yield.bur \
                   examples/concurrency/pipeline.bur examples/io/sleep.bur \
                   examples/types/enum_mono.bur examples/types/shapes.bur \
                   testdata/pkg/deferred testdata/pkg/sccorder; do
            out=$(basename "$f" .bur)
            ./gen1 build "$f" -o "lvm_c_$out"
            ./gen1 build --backend llvm "$f" -o "lvm_l_$out"
            rc1=0
            timeout 20 "./lvm_c_$out" > "lvm_c_$out.txt" 2>&1 || rc1=$?
            rc2=0
            timeout 20 "./lvm_l_$out" > "lvm_l_$out.txt" 2>&1 || rc2=$?
            if cmp -s "lvm_c_$out.txt" "lvm_l_$out.txt" && [ "$rc1" -eq "$rc2" ]; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              echo "FAIL $f: rc $rc1 vs $rc2"
              diff "lvm_c_$out.txt" "lvm_l_$out.txt" | head -6
            fi
          done
          echo "=== llvm-vs-c: $pass pass, $fail fail ==="
          [ "$fail" -eq 0 ]

  llvm-pe-build:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      # S8.8：llvm 后端 mingw 交叉链接产 Windows PE（免 SDK 交叉路），切片与
      # x86-pe-build 同单（net/fs/exec/timer/float 形状全覆盖）
      # S8.8: the LLVM backend cross-links Windows PEs through mingw (the
      # SDK-free path); the slice matches x86-pe-build case for case
      - name: Install mingw-w64
        run: |
          set -euo pipefail
          command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1 || sudo apt-get update -qq
          command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1 || sudo apt-get install -y -qq mingw-w64
          x86_64-w64-mingw32-gcc --version | head -n 1

      - name: Build windows programs (LLVM backend)
        run: |
          set -euo pipefail
          chmod +x gen1
          mkdir -p llvm-pe-out
          ./gen1 build --backend llvm --os windows examples/basics/hello.bur -o llvm-pe-out/hello.exe
          ./gen1 build --backend llvm --os windows examples/basics/fib.bur -o llvm-pe-out/fib.exe
          ./gen1 build --backend llvm --os windows examples/basics/float_arith.bur -o llvm-pe-out/float_arith.exe
          ./gen1 build --backend llvm --os windows examples/concurrency/yield.bur -o llvm-pe-out/yield.exe
          ./gen1 build --backend llvm --os windows testdata/regression/clock.bur -o llvm-pe-out/clock.exe
          ./gen1 build --backend llvm --os windows examples/io/fs.bur -o llvm-pe-out/fs.exe
          ./gen1 build --backend llvm --os windows examples/io/sleep.bur -o llvm-pe-out/sleep.exe
          ./gen1 build --backend llvm --os windows examples/net/net_loopback.bur -o llvm-pe-out/net_loopback.exe
          ./gen1 build --backend llvm --os windows examples/net/net_nb.bur -o llvm-pe-out/net_nb.exe

      - name: Upload windows programs (LLVM backend)
        uses: actions/upload-artifact@v4
        with:
          name: llvm-pe-progs
          path: llvm-pe-out
          if-no-files-found: error
          retention-days: 7

  llvm-pe-run:
    needs: llvm-pe-build
    if: always() && needs.llvm-pe-build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download windows programs (LLVM backend)
        uses: actions/download-artifact@v4
        with:
          name: llvm-pe-progs
          path: pe-out

      # mingw CRT 的 stdout 是文本模式（\n→\r\n，与 MSVC 同），金样是 LF：
      # 比对前做 CRLF 归一，剔除 CRT 平台工件
      # mingw CRT's stdout is text mode (\n -> \r\n, same as MSVC) while the
      # goldens are LF: normalize CRLF before comparing to strip the CRT
      # platform artifact
      - name: Run slice vs goldens (hard gate)
        shell: pwsh
        run: |
          function Check-One([string]$bin, [string]$golden) {
            $n = [IO.Path]::GetFileNameWithoutExtension($bin)
            $p = Start-Process -FilePath $bin -RedirectStandardOutput "raw-$n.txt" -PassThru -NoNewWindow
            $null = $p.Handle
            if (-not $p.WaitForExit(30000)) { taskkill /F /T /PID $p.Id | Out-Null; Write-Error "$n timed out"; exit 1 }
            if ($p.ExitCode -ne 0) { Write-Error "$n exit code $($p.ExitCode)"; exit 1 }
            [IO.File]::WriteAllText("act-$n.txt", ([IO.File]::ReadAllText("raw-$n.txt") -replace "`r`n", "`n"))
            if ((Get-Item "act-$n.txt").Length -eq 0) { Write-Error "empty stdout from $n"; exit 1 }
            git diff --no-index --text $golden "act-$n.txt"
            if ($LASTEXITCODE -ne 0) { Write-Error "$n output mismatch"; exit 1 }
            Write-Output "OK $n"
          }
          Check-One ".\pe-out\hello.exe" "examples/basics/hello.golden"
          Check-One ".\pe-out\fib.exe" "examples/basics/fib.golden"
          Check-One ".\pe-out\float_arith.exe" "examples/basics/float_arith.golden"
          Check-One ".\pe-out\yield.exe" "examples/concurrency/yield.golden"
          Check-One ".\pe-out\clock.exe" "testdata/regression/clock.golden"
          Check-One ".\pe-out\sleep.exe" "examples/io/sleep.golden"
          Check-One ".\pe-out\fs.exe" "examples/io/fs.golden"

      # net 用例走看门狗：卡死的 fiber 唤醒路径不该把 job 拖到超时才暴露
      # Net cases run under a watchdog: a stuck fiber wake path must fail fast
      - name: Run net slice (hard gate)
        shell: pwsh
        run: |
          foreach ($t in @("net_loopback", "net_nb")) {
            $p = Start-Process -FilePath ".\pe-out\$t.exe" -RedirectStandardOutput "raw-$t.txt" -PassThru -NoNewWindow
            $null = $p.Handle
            if (-not $p.WaitForExit(30000)) { taskkill /F /T /PID $p.Id | Out-Null; Write-Error "$t timed out"; exit 1 }
            if ($p.ExitCode -ne 0) { Write-Error "$t exit code $($p.ExitCode)"; exit 1 }
            [IO.File]::WriteAllText("act-$t.txt", ([IO.File]::ReadAllText("raw-$t.txt") -replace "`r`n", "`n"))
            git diff --no-index --exit-code --text "examples/net/$t.golden" "act-$t.txt"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Output "OK $t"
          }

  sdk-pack:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Pack the macOS SDK for the darwin cross link
        run: |
          set -euo pipefail
          sdk="$(xcrun --show-sdk-path)"
          echo "SDK: $sdk"
          mkdir -p sdk-out
          tar cfz sdk-out/macos-sdk.tar.gz -C "$(dirname "$sdk")" "$(basename "$sdk")"
          ls -la sdk-out

      - name: Upload macOS SDK
        uses: actions/upload-artifact@v4
        with:
          name: macos-sdk
          path: sdk-out
          if-no-files-found: error
          retention-days: 7

  llvm-macho-build:
    needs: [gen1, sdk-pack]
    if: always() && needs.gen1.result == 'success' && needs.sdk-pack.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: Download macOS SDK
        uses: actions/download-artifact@v4
        with:
          name: macos-sdk
          path: sdk-out

      - name: Install lld
        run: |
          set -euo pipefail
          command -v ld64.lld >/dev/null 2>&1 || sudo apt-get update -qq
          command -v ld64.lld >/dev/null 2>&1 || sudo apt-get install -y -qq lld
          (ld64.lld --version 2>/dev/null || ld64.lld-18 --version 2>/dev/null || ld64.lld-17 --version 2>/dev/null || ld64.lld-16 --version 2>/dev/null || ld64.lld-15 --version 2>/dev/null || ld64.lld-14 --version) | head -n 1

      # gen1 是上一代自举：还不带 --os darwin 的链接路——先用它（C 路）编出当前
      # 编译器，跨链接由当前编译器驱动
      # gen1 is the previous-generation bootstrap and predates the darwin link
      # path — build the current compiler with it (C path) first and drive the
      # cross link through that
      - name: Build macho programs (LLVM backend)
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 build compiler -o bur_cur
          mkdir -p sdk
          tar xfz sdk-out/macos-sdk.tar.gz -C sdk
          sdkdir="$(ls sdk)"
          echo "SDK dir: $sdkdir"
          mkdir -p macho-out
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" examples/basics/hello.bur -o macho-out/hello
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" examples/basics/fib.bur -o macho-out/fib
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" examples/basics/float_arith.bur -o macho-out/float_arith
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" examples/concurrency/yield.bur -o macho-out/yield
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" testdata/regression/clock.bur -o macho-out/clock
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" examples/io/fs.bur -o macho-out/fs
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" examples/io/sleep.bur -o macho-out/sleep
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" examples/net/net_loopback.bur -o macho-out/net_loopback
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" examples/net/net_nb.bur -o macho-out/net_nb
          ./bur_cur build --backend llvm --os darwin --macos-sdk "sdk/$sdkdir" testdata/pkg/deferred -o macho-out/deferred

      - name: Upload macho programs (LLVM backend)
        uses: actions/upload-artifact@v4
        with:
          name: llvm-macho-progs
          path: macho-out
          if-no-files-found: error
          retention-days: 7

  llvm-macho-run:
    needs: llvm-macho-build
    if: always() && needs.llvm-macho-build.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macho programs (LLVM backend)
        uses: actions/download-artifact@v4
        with:
          name: llvm-macho-progs
          path: macho-out

      - name: Run slice vs goldens (hard gate)
        run: |
          set -euo pipefail
          # 每例 30 秒看门狗（perl alarm，SIGALRM 退出码 142）：卡死即失败，不拖到 job 超时
          # 30-second watchdog per program (perl alarm, SIGALRM exits 142): a hang
          # fails fast instead of holding the job until its timeout
          check_one() {
            codesign -f -s - "macho-out/$1"
            chmod +x "macho-out/$1"
            set +e
            perl -e 'alarm 30; exec @ARGV' "macho-out/$1" > "actual-$1.txt" 2>"run-$1.err"
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then echo "$1 exited $rc"; head -5 "run-$1.err"; exit $rc; fi
            diff "$2" "actual-$1.txt"
            echo "OK $1"
          }
          check_one hello examples/basics/hello.golden
          check_one fib examples/basics/fib.golden
          check_one float_arith examples/basics/float_arith.golden
          check_one yield examples/concurrency/yield.golden
          check_one clock testdata/regression/clock.golden
          check_one sleep examples/io/sleep.golden
          check_one fs examples/io/fs.golden

      - name: Run net slice (hard gate)
        run: |
          set -euo pipefail
          check_one() {
            codesign -f -s - "macho-out/$1"
            chmod +x "macho-out/$1"
            set +e
            perl -e 'alarm 30; exec @ARGV' "macho-out/$1" > "actual-$1.txt" 2>"run-$1.err"
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then echo "$1 exited $rc"; head -5 "run-$1.err"; exit $rc; fi
            diff "examples/net/$1.golden" "actual-$1.txt"
            echo "OK $1"
          }
          check_one net_loopback
          check_one net_nb

  x86-pe-build:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      # PE corpus: hello + pure slice (fib, float_arith) + yield + timer slice
      # (clock, sleep), all hard-gated against their goldens.
      - name: Build windows programs
        run: |
          set -euo pipefail
          chmod +x gen1
          mkdir -p pe-out
          ./gen1 build --backend x86 --os windows examples/basics/hello.bur -o pe-out/hello.exe
          ./gen1 build --backend x86 --os windows examples/basics/fib.bur -o pe-out/fib.exe
          ./gen1 build --backend x86 --os windows examples/basics/float_arith.bur -o pe-out/float_arith.exe
          ./gen1 build --backend x86 --os windows examples/concurrency/yield.bur -o pe-out/yield.exe
          ./gen1 build --backend x86 --os windows testdata/regression/clock.bur -o pe-out/clock.exe
          ./gen1 build --backend x86 --os windows examples/io/fs.bur -o pe-out/fs.exe
          ./gen1 build --backend x86 --os windows examples/io/sleep.bur -o pe-out/sleep.exe
          ./gen1 build --backend x86 --os windows examples/net/net_loopback.bur -o pe-out/net_loopback.exe
          ./gen1 build --backend x86 --os windows examples/net/net_nb.bur -o pe-out/net_nb.exe
          ./gen1 build --backend x86 --os windows testdata/pie/spin.bur -o pe-out/spin.exe
          BUR=./gen1 ./scripts/xos-corpus.sh windows pe-out/corpus

      - name: Upload windows programs
        uses: actions/upload-artifact@v4
        with:
          name: x86-pe-progs
          path: pe-out
          if-no-files-found: error
          retention-days: 7

  x86-pe-run:
    needs: x86-pe-build
    if: always() && needs.x86-pe-build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download windows programs
        uses: actions/download-artifact@v4
        with:
          name: x86-pe-progs
          path: pe-out

      - name: Run and compare golden
        shell: pwsh
        run: |
          cmd /c ".\pe-out\hello.exe > actual.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text examples/basics/hello.golden actual.txt
          if ((Get-Item actual.txt).Length -eq 0) { Write-Error "empty stdout from actual.txt"; exit 1 }

      - name: Run pure corpus slice
        shell: pwsh
        run: |
          cmd /c ".\pe-out\fib.exe > actual-fib.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text examples/basics/fib.golden actual-fib.txt
          if ((Get-Item actual-fib.txt).Length -eq 0) { Write-Error "empty stdout from actual-fib.txt"; exit 1 }
          cmd /c ".\pe-out\float_arith.exe > actual-float_arith.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text examples/basics/float_arith.golden actual-float_arith.txt
          if ((Get-Item actual-float_arith.txt).Length -eq 0) { Write-Error "empty stdout from actual-float_arith.txt"; exit 1 }

      - name: Run spawn slice (hard gate)
        shell: pwsh
        run: |
          cmd /c ".\pe-out\yield.exe > actual-yield.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text examples/concurrency/yield.golden actual-yield.txt
          if ((Get-Item actual-yield.txt).Length -eq 0) { Write-Error "empty stdout from actual-yield.txt"; exit 1 }

      - name: Run timer slice (hard gate)
        shell: pwsh
        run: |
          cmd /c ".\pe-out\clock.exe > actual-clock.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text testdata/regression/clock.golden actual-clock.txt
          if ((Get-Item actual-clock.txt).Length -eq 0) { Write-Error "empty stdout from actual-clock.txt"; exit 1 }
          cmd /c ".\pe-out\sleep.exe > actual-sleep.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text examples/io/sleep.golden actual-sleep.txt
          if ((Get-Item actual-sleep.txt).Length -eq 0) { Write-Error "empty stdout from actual-sleep.txt"; exit 1 }

      - name: Run fs slice (hard gate)
        shell: pwsh
        run: |
          cmd /c ".\pe-out\fs.exe > actual-fs.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text examples/io/fs.golden actual-fs.txt
          if ((Get-Item actual-fs.txt).Length -eq 0) { Write-Error "empty stdout from actual-fs.txt"; exit 1 }
          if ((Get-Item actual-sleep.txt).Length -eq 0) { Write-Error "empty stdout from actual-sleep.txt"; exit 1 }

      # net 用例走看门狗：卡死的 fiber 唤醒路径不该把 job 拖到超时才暴露。
      # Net cases run under a watchdog: a stuck fiber wake path must fail fast
      # rather than hold the job until its timeout.
      - name: Run net slice (hard gate)
        shell: pwsh
        run: |
          foreach ($t in @("net_loopback", "net_nb")) {
            $p = Start-Process -FilePath ".\pe-out\$t.exe" -RedirectStandardOutput "actual-$t.txt" -PassThru -NoNewWindow
            if (-not $p.WaitForExit(30000)) { taskkill /F /T /PID $p.Id | Out-Null; Write-Error "$t timed out"; exit 1 }
            if ($p.ExitCode -ne 0) { Write-Error "$t exit code $($p.ExitCode)"; exit 1 }
            git diff --no-index --exit-code --text "examples/net/$t.golden" "actual-$t.txt"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # PIE：常驻进程的实际映像基址不得等于链接基址 0x400000（Windows 映像 ASLR 按
      # 开机选偏移，同一镜像多次运行基址相同，故只查偏离链接基址）
      # PIE: the resident process's real image base must differ from the link
      # base 0x400000 (Windows image ASLR picks the bias per boot, so repeated
      # runs share a base; only the departure from the link base is checked)
      - name: PIE image base (hard gate)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\pe-out\spin.exe" -PassThru -NoNewWindow
          Start-Sleep -Milliseconds 500
          $p.Refresh()
          $b = $p.MainModule.BaseAddress.ToInt64()
          taskkill /F /PID $p.Id | Out-Null
          Write-Output ("image base 0x{0:x}" -f $b)
          if ($b -eq 0x400000) { Write-Error "image loaded at its link base"; exit 1 }

      # 全量语料对照 Linux x86 基准（stdout + 退出码），任一例不符即失败
      # Full corpus against the Linux x86 reference (stdout + exit code); any
      # mismatch fails the job
      - name: Cross-target corpus vs Linux x86 (hard gate)
        shell: pwsh
        run: |
          # 语料里的 /tmp 路径在 Windows 解析为当前盘 \tmp / corpus /tmp paths resolve to \tmp on the current drive
          New-Item -ItemType Directory -Force -Path \tmp | Out-Null
          # exec 语料调用的外部命令须在 PATH 上 / external commands the exec corpus runs must be on PATH
          where.exe echo false sh
          $pass = 0; $fail = 0; $probe = 0
          foreach ($n in Get-Content pe-out/corpus/CASES) {
            $want = [int](Get-Content "pe-out/corpus/$n.rc")
            $p = Start-Process -FilePath "pe-out/corpus/$n.exe" -RedirectStandardOutput "act-$n.txt" -RedirectStandardError "err-$n.txt" -PassThru -NoNewWindow
            $null = $p.Handle
            if (-not $p.WaitForExit(20000)) { taskkill /F /T /PID $p.Id | Out-Null; $rc = 124 } else { $rc = $p.ExitCode }
            # 子进程可能仍持有继承的输出句柄：读哈希失败时稍候重试，不让一例中断整步
            # a child may still hold the inherited output handle: retry the
            # hash briefly instead of letting one case abort the whole step
            $h = $null
            for ($try = 0; $try -lt 10 -and $null -eq $h; $try++) {
              try { $h = (Get-FileHash "act-$n.txt" -ErrorAction Stop).Hash } catch { Start-Sleep -Milliseconds 500 }
            }
            $same = $h -eq (Get-FileHash "pe-out/corpus/$n.expected").Hash
            if ($same -and $rc -eq $want) { $pass++ } else {
              $fail++
              Write-Output ("FAIL {0}: rc {1} (want {2}) hash-read={3}" -f $n, $rc, $want, ($null -ne $h))
              git diff --no-index --text "pe-out/corpus/$n.expected" "act-$n.txt" | Select-Object -Skip 4 -First 6
              # 非零退场时 od stderr 前 128B（诊断用；§18 探针已随根因修复回退）
              # on a non-zero exit, od the first 128B of stderr (diagnostics;
              # the section-18 probes were reverted with the root-cause fix)
              if (Test-Path "err-$n.txt") { od -An -tx1 -N128 "err-$n.txt" }
            }
          }
          $p = Start-Process -FilePath "pe-out/corpus/examples_basics_args.exe" -ArgumentList 'one "two words" 三' -RedirectStandardOutput "act-argv.txt" -RedirectStandardError "err-argv.txt" -PassThru -NoNewWindow
          $null = $p.Handle
          if (-not $p.WaitForExit(20000)) { taskkill /F /T /PID $p.Id | Out-Null; $rc = 124 } else { $rc = $p.ExitCode }
          $h = $null
          for ($try = 0; $try -lt 10 -and $null -eq $h; $try++) {
            try { $h = (Get-FileHash "act-argv.txt" -ErrorAction Stop).Hash } catch { Start-Sleep -Milliseconds 500 }
          }
          $same = $h -eq (Get-FileHash "pe-out/corpus/ARGV.expected").Hash
          if ($same -and $rc -eq 0) { $pass++ } else {
            $fail++
            Write-Output ("FAIL args with arguments: rc {0} hash-read={1}" -f $rc, ($null -ne $h))
            git diff --no-index --text "pe-out/corpus/ARGV.expected" "act-argv.txt" | Select-Object -Skip 4 -First 6
            if (Test-Path "err-argv.txt") { Get-Content "err-argv.txt" -TotalCount 6 }
          }
          $p = Start-Process -FilePath "pe-out/corpus/examples_io_stdin.exe" -RedirectStandardInput "pe-out/corpus/STDIN.in" -RedirectStandardOutput "act-stdin.txt" -RedirectStandardError "err-stdin.txt" -PassThru -NoNewWindow
          $null = $p.Handle
          if (-not $p.WaitForExit(20000)) { taskkill /F /T /PID $p.Id | Out-Null; $rc = 124 } else { $rc = $p.ExitCode }
          $h = $null
          for ($try = 0; $try -lt 10 -and $null -eq $h; $try++) {
            try { $h = (Get-FileHash "act-stdin.txt" -ErrorAction Stop).Hash } catch { Start-Sleep -Milliseconds 500 }
          }
          $same = $h -eq (Get-FileHash "pe-out/corpus/STDIN.expected").Hash
          if ($same -and $rc -eq 0) { $pass++ } else {
            $fail++
            Write-Output ("FAIL stdin from a file: rc {0} hash-read={1}" -f $rc, ($null -ne $h))
            git diff --no-index --text "pe-out/corpus/STDIN.expected" "act-stdin.txt" | Select-Object -Skip 4 -First 6
            if (Test-Path "err-stdin.txt") { Get-Content "err-stdin.txt" -TotalCount 6 }
          }
          Write-Output "=== corpus: $pass pass, $fail fail, $probe probe-hits ==="
          if ($fail -ne 0) { exit 1 }

      - name: Set up MSVC for x86-vs-C corpus
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      # 同平台 x86 vs C（stdout + stderr + 退出码逐项对照）：完成线「同一程序在三平台
      # x86 上与同平台 C 完全一致」的机械闸；strerror 文本天然逐平台，不做跨目标比对
      - name: Corpus x86 vs C on this platform (hard gate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path \tmp | Out-Null
          # 多文件一锅 cl 的 "Generating Code..." 批语义会与首个语例的链接竞争
          # obj 落盘（LNK1181 flake 两度咬门禁）——拆成单文件串行编译，时序即定
          # A single multi-file cl batch ("Generating Code...") raced the first
          # corpus case's link to the obj files (the LNK1181 flake bit the gate
          # twice) — compile one file per invocation so the ordering is fixed
          cl /nologo /O1 /c runtime\burrt_impl.c /Iruntime 2>&1 | Select-Object -First 3
          cl /nologo /O1 /c runtime\burrt_natives.c /Iruntime 2>&1 | Select-Object -First 3
          if (-not (Test-Path burrt_impl.obj) -or -not (Test-Path burrt_natives.obj)) { Write-Error "runtime objs missing after compile"; exit 1 }
          $pass = 0; $fail = 0; $skip = 0
          foreach ($n in Get-Content pe-out/corpus/CASES) {
            if (-not (Test-Path "pe-out/corpus/$n.c")) { $skip++; continue }
            $cc = Start-Process -FilePath "cl" -ArgumentList @("/nologo", "/O1", "/Fe:pe-out/corpus/c-$n.exe", "pe-out/corpus/$n.c", "burrt_impl.obj", "burrt_natives.obj", "/Iruntime", "ws2_32.lib") -RedirectStandardOutput "cc-out.txt" -RedirectStandardError "cc-err.txt" -NoNewWindow -PassThru -Wait
            if ($cc.ExitCode -ne 0) { $fail++; Write-Output ("CCFAIL {0} exit {1}" -f $n, $cc.ExitCode); Get-Content "cc-out.txt" -TotalCount 8; Get-Content "cc-err.txt" -TotalCount 8; continue }
            $p1 = Start-Process -FilePath "pe-out/corpus/$n.exe" -RedirectStandardOutput "x-out.txt" -RedirectStandardError "x-err.txt" -PassThru -NoNewWindow
            $null = $p1.Handle
            if (-not $p1.WaitForExit(20000)) { taskkill /F /T /PID $p1.Id | Out-Null; $rc1 = 124 } else { $rc1 = $p1.ExitCode }
            $p2 = Start-Process -FilePath "pe-out/corpus/c-$n.exe" -RedirectStandardOutput "c-out.txt" -RedirectStandardError "c-err.txt" -PassThru -NoNewWindow
            $null = $p2.Handle
            if (-not $p2.WaitForExit(20000)) { taskkill /F /T /PID $p2.Id | Out-Null; $rc2 = 124 } else { $rc2 = $p2.ExitCode }
            # MSVC CRT 的 stdout/stderr 是文本模式（\n→\r\n），x86 是裸 write（LF）：
            # 比对前做 CRLF 归一，剔除 CRT 平台工件
            $o1 = [IO.File]::ReadAllText("x-out.txt") -replace "`r`n", "`n"
            $o2 = [IO.File]::ReadAllText("c-out.txt") -replace "`r`n", "`n"
            $e1 = [IO.File]::ReadAllText("x-err.txt") -replace "`r`n", "`n"
            $e2 = [IO.File]::ReadAllText("c-err.txt") -replace "`r`n", "`n"
            if ($o1 -eq $o2 -and $e1 -eq $e2 -and $rc1 -eq $rc2) { $pass++ } else {
              $fail++
              Write-Output ("FAIL {0}: x86 rc {1}, C rc {2}" -f $n, $rc1, $rc2)
              git diff --no-index --text "x-out.txt" "c-out.txt" | Select-Object -First 6
              git diff --no-index --text "x-err.txt" "c-err.txt" | Select-Object -First 6
              if (Test-Path "x-err.txt") { od -An -tx1 -N128 "x-err.txt" }
            }
          }
          Write-Output "=== x86-vs-C: $pass pass, $fail fail, $skip no-c ==="
          if ($fail -ne 0) { exit 1 }

  x86-macho-build:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: Build darwin programs
        run: |
          set -euo pipefail
          chmod +x gen1
          mkdir -p macho-out
          ./gen1 build --backend x86 --os darwin examples/basics/hello.bur -o macho-out/hello-mac
          ./gen1 build --backend x86 --os darwin testdata/regression/clock.bur -o macho-out/clock-mac
          ./gen1 build --backend x86 --os darwin examples/basics/fib.bur -o macho-out/fib-mac
          ./gen1 build --backend x86 --os darwin examples/basics/float_arith.bur -o macho-out/float_arith-mac
          ./gen1 build --backend x86 --os darwin examples/concurrency/yield.bur -o macho-out/yield-mac
          ./gen1 build --backend x86 --os darwin examples/io/sleep.bur -o macho-out/sleep-mac
          ./gen1 build --backend x86 --os darwin examples/concurrency/pipeline.bur -o macho-out/pipeline-mac
          ./gen1 build --backend x86 --os darwin examples/io/fs.bur -o macho-out/fs-mac
          ./gen1 build --backend x86 --os darwin examples/net/net_loopback.bur -o macho-out/net_loopback-mac
          ./gen1 build --backend x86 --os darwin examples/net/net_nb.bur -o macho-out/net_nb-mac
          ./gen1 build --backend x86 --os darwin testdata/pie/spin.bur -o macho-out/spin-mac
          BUR=./gen1 ./scripts/xos-corpus.sh darwin macho-out/corpus

      - name: Upload macho programs
        uses: actions/upload-artifact@v4
