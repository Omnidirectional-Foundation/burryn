# L0 births gen1 as a tool (C midwife, not the CI product).
# L0 接生 gen1 当工具（C 只接生，不是 CI 产物）。
# bur-base is minted once per seed/go-host SHA at CC_OPT=-O1, fingerprinted,
# and reused. Cache is a shortcut; identity is go-host SHA + sha256.
# bur-base 按 seed/go-host SHA、CC_OPT=-O1 接生一次并打指纹后复用。
# cache 是捷径，身份是 go-host SHA + sha256。
# gen1 is born every push from current compiler/. Verify jobs download gen1.
# gen1 每个 push 从当前 compiler/ 接生。验证 job 下载 gen1。
# The C three-gen fixpoint runs on push: it is the only check that catches
# nondeterminism and runtime-state defects the behaviour suites cannot see.
# C 三代定点进每次 push：行为套件看不见的不确定性与运行时状态缺陷，只有它能抓。
# Linux x86 ELF parity runs on push in the multibackend job: VM / C / x86
# stdout + exit code agreement via scripts/multi-backend-verify.sh.
# Linux x86 ELF 对照进每次 push（三方 stdout + exit code 一致）。
name: CI

on:
  push:
    branches: [main, dev, "dev/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gohost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gohost.outputs.sha }}
      hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout Go seed
        uses: actions/checkout@v4
        with:
          ref: seed/go-host
          path: _go-host

      - name: go-host SHA
        id: gohost
        run: echo "sha=$(git -C _go-host rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Probe bur-base cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: bur-base
          key: bur-base-${{ steps.gohost.outputs.sha }}-O1
          lookup-only: true

  seed:
    needs: gohost
    if: needs.gohost.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Go seed
        uses: actions/checkout@v4
        with:
          ref: seed/go-host
          path: _go-host

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: _go-host/go.mod
          cache: false

      - name: Build bur-seed
        run: |
          set -euo pipefail
          rm -f _go-host/program.c
          (cd _go-host && go build -o "$GITHUB_WORKSPACE/bur-seed" .)

      - name: Upload bur-seed
        uses: actions/upload-artifact@v4
        with:
          name: bur-seed
          path: bur-seed
          if-no-files-found: error
          retention-days: 3

  bur-base:
    needs: [gohost, seed]
    if: |
      always() &&
      needs.gohost.result == 'success' &&
      (needs.seed.result == 'success' || needs.seed.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Go seed
        uses: actions/checkout@v4
        with:
          ref: seed/go-host
          path: _go-host

      - name: Restore bur-base
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: bur-base
          key: bur-base-${{ needs.gohost.outputs.sha }}-O1

      - name: Download bur-seed
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: bur-seed

      - name: Build bur-base
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CC_OPT: "-O1"
        run: |
          set -euo pipefail
          chmod +x bur-seed
          echo "go-host ${{ needs.gohost.outputs.sha }}"
          cc --version | head -n 1
          echo "CC_OPT=$CC_OPT"
          touch /tmp/bb-alive
          (
            while [ -f /tmp/bb-alive ]; do
              sleep 45
              echo "[bur-base still running $(date -u +%H:%M:%S)]"
            done
          ) &
          echo $! > /tmp/bb-hb.pid
          (cd _go-host && "$GITHUB_WORKSPACE/bur-seed" build burc -o "$GITHUB_WORKSPACE/bur-base")
          rm -f /tmp/bb-alive
          wait "$(cat /tmp/bb-hb.pid)" 2>/dev/null || true

      - name: Fingerprint bur-base
        run: |
          set -euo pipefail
          chmod +x bur-base
          echo "go-host ${{ needs.gohost.outputs.sha }}"
          echo "CC_OPT=-O1"
          cc --version | head -n 1
          sha256sum bur-base | tee bur-base.sha256

      - name: Save bur-base cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bur-base
          key: bur-base-${{ needs.gohost.outputs.sha }}-O1

      - name: Upload bur-base
        uses: actions/upload-artifact@v4
        with:
          name: bur-base
          path: |
            bur-base
            bur-base.sha256
          if-no-files-found: error
          retention-days: 14

  gen1:
    needs: bur-base
    if: always() && needs['bur-base'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang
      CC_OPT: -O1
      MALLOC_ARENA_MAX: "2"
    steps:
      - name: Create swap
        run: |
          set -euo pipefail
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bur-base
        uses: actions/download-artifact@v4
        with:
          name: bur-base

      - name: Checkout Go seed runtime
        uses: actions/checkout@v4
        with:
          ref: seed/go-host
          path: _go-host

      - name: Birth gen1
        run: |
          set -euo pipefail
          chmod +x bur-base
          cp _go-host/runtime/burrt.h runtime/burrt.h
          cp _go-host/runtime/burrt_natives.h runtime/burrt_natives.h
          rm -f program.c
          ./bur-base build compiler -o gen1
          git checkout -- runtime/burrt.h runtime/burrt_natives.h

      - name: Upload gen1
        uses: actions/upload-artifact@v4
        with:
          name: gen1
          path: gen1
          if-no-files-found: error
          retention-days: 7


  check:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: fmt and typecheck
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 fmt --check compiler
          ./gen1 check compiler

      - name: std embed table matches std sources
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 dev embed-std .
          git diff --exit-code compiler/lib/std_embed.bur

  fixpoint:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang
      CC_OPT: -O1
      MALLOC_ARENA_MAX: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: Three-generation fixpoint
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 build compiler -o g1c
          ./g1c build compiler -o g2c
          sha256sum g1c g2c
          cmp g1c g2c

  testdata:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: testdata-verify
        run: |
          set -euo pipefail
          chmod +x gen1
          mv gen1 bur
          BUR=./bur SKIP_FIXPOINT=1 ./scripts/testdata-verify.sh

  examples:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: examples-verify
        run: |
          set -euo pipefail
          chmod +x gen1
          mv gen1 bur
          BUR=./bur ./scripts/examples-verify.sh

  std:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: std tests
        run: |
          set -euo pipefail
          chmod +x gen1
          for p in cli encoding json net path testing; do
            ./gen1 test "std/$p"
          done

  multibackend:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: multi-backend-verify
        run: |
          set -euo pipefail
          chmod +x gen1
          mv gen1 bur
          BUR=./bur ./scripts/multi-backend-verify.sh

  x86-repro:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      # x86 artifact reproducibility, not the C three-generation fixpoint:
      # there is no x86 self-chain. The same compiler building the same
      # source twice must emit byte-identical output (no timestamps,
      # no hash-order leaks in the serializers).
      - name: Build each target twice and compare
        run: |
          set -euo pipefail
          chmod +x gen1
          ./gen1 build --backend x86 examples/basics/hello.bur -o elf-a
          ./gen1 build --backend x86 examples/basics/hello.bur -o elf-b
          cmp elf-a elf-b
          ./gen1 build --backend x86 --os windows examples/basics/hello.bur -o pe-a.exe
          ./gen1 build --backend x86 --os windows examples/basics/hello.bur -o pe-b.exe
          cmp pe-a.exe pe-b.exe
          ./gen1 build --backend x86 --os darwin examples/basics/hello.bur -o macho-a
          ./gen1 build --backend x86 --os darwin examples/basics/hello.bur -o macho-b
          cmp macho-a macho-b

  x86-pe-build:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      # P0 probes: hello + the pure slice (fib, float_arith, expected green)
      # + clock (sleep path needs poll(7): expected SIGILL, evidence only).
      - name: Build windows programs
        run: |
          set -euo pipefail
          chmod +x gen1
          mkdir -p pe-out
          ./gen1 build --backend x86 --os windows examples/basics/hello.bur -o pe-out/hello.exe
          ./gen1 build --backend x86 --os windows examples/basics/fib.bur -o pe-out/fib.exe
          ./gen1 build --backend x86 --os windows examples/basics/float_arith.bur -o pe-out/float_arith.exe
          ./gen1 build --backend x86 --os windows testdata/regression/clock.bur -o pe-out/clock.exe

      - name: Upload windows programs
        uses: actions/upload-artifact@v4
        with:
          name: x86-pe-progs
          path: pe-out
          if-no-files-found: error
          retention-days: 7

  x86-pe-run:
    needs: x86-pe-build
    if: always() && needs.x86-pe-build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download windows programs
        uses: actions/download-artifact@v4
        with:
          name: x86-pe-progs
          path: pe-out

      - name: Run and compare golden
        shell: pwsh
        run: |
          cmd /c ".\pe-out\hello.exe > actual.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text examples/basics/hello.golden actual.txt

      - name: Run pure corpus slice
        shell: pwsh
        run: |
          cmd /c ".\pe-out\fib.exe > actual-fib.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text examples/basics/fib.golden actual-fib.txt
          cmd /c ".\pe-out\float_arith.exe > actual-float_arith.txt"
          if ($LASTEXITCODE -ne 0) { Write-Error "exit code $LASTEXITCODE"; exit 1 }
          git diff --no-index --text examples/basics/float_arith.golden actual-float_arith.txt

      # Evidence only: the sleep path parks into poll(7), which the PE
      # dispatcher lacks, so clock is expected to die on ud2 (0xC000001D).
      # This step never fails the job; P2 (WSAPoll arm) turns it green.
      - name: Probe sleep path (expected crash, evidence only)
        shell: pwsh
        continue-on-error: true
        run: |
          cmd /c ".\pe-out\clock.exe > actual-clock.txt 2>&1"
          echo "clock.exe exit code: $LASTEXITCODE"
          Get-Content actual-clock.txt -ErrorAction SilentlyContinue | Select-Object -First 5

  x86-macho-build:
    needs: gen1
    if: always() && needs.gen1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download gen1
        uses: actions/download-artifact@v4
        with:
          name: gen1

      - name: Build darwin programs
        run: |
          set -euo pipefail
          chmod +x gen1
          mkdir -p macho-out
          ./gen1 build --backend x86 --os darwin examples/basics/hello.bur -o macho-out/hello-mac
          ./gen1 build --backend x86 --os darwin testdata/regression/clock.bur -o macho-out/clock-mac
          ./gen1 build --backend x86 --os darwin examples/basics/fib.bur -o macho-out/fib-mac
          ./gen1 build --backend x86 --os darwin examples/basics/float_arith.bur -o macho-out/float_arith-mac
          ./gen1 build --backend x86 --os darwin examples/concurrency/yield.bur -o macho-out/yield-mac
          ./gen1 build --backend x86 --os darwin examples/io/sleep.bur -o macho-out/sleep-mac
          ./gen1 build --backend x86 --os darwin examples/concurrency/pipeline.bur -o macho-out/pipeline-mac

      - name: Upload macho programs
        uses: actions/upload-artifact@v4
        with:
          name: x86-macho-progs
          path: macho-out
          if-no-files-found: error
          retention-days: 7

  x86-macho-run:
    needs: x86-macho-build
    if: always() && needs.x86-macho-build.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macho programs
        uses: actions/download-artifact@v4
        with:
          name: x86-macho-progs
          path: macho-out

      - name: Run and compare golden
        run: |
          set -euo pipefail
          codesign -f -s - macho-out/hello-mac
          codesign --verify --strict --verbose=2 macho-out/hello-mac
          chmod +x macho-out/hello-mac
          xattr -cr macho-out/hello-mac 2>/dev/null || true
          echo "--- spctl:"
          spctl --assess --type execute -vvv macho-out/hello-mac || true
          echo "--- unsigned control:"
          cp macho-out/hello-mac hello-unsigned
          codesign --remove-signature hello-unsigned || true
          ./hello-unsigned && echo "UNSIGNED RUNS" || echo "unsigned rc=$?"
          echo "--- signed run:"
          if ./macho-out/hello-mac > actual.txt; then
            diff examples/basics/hello.golden actual.txt
          else
            rc=$?
            echo "hello-mac exited $rc"
            echo "--- kernel denials:"
            log show --last 5m --style compact --predicate 'sender == "kernel"' 2>/dev/null | command grep -Ei "hello-mac|cs_invalid|code sign|AMFI.*deny|macos_policy" | tail -30 || true
            echo "--- latest crash reports:"
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -3
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/hello-mac*.ips 2>/dev/null | head -1); do cat "$f"; done
            exit "$rc"
          fi

      - name: Run clock and corpus slice
        run: |
          set -euo pipefail
          check_one() {
            codesign -f -s - "macho-out/$1"
            chmod +x "macho-out/$1"
            "macho-out/$1" > "actual-$1.txt"
            diff "$2" "actual-$1.txt"
          }
          check_one clock-mac testdata/regression/clock.golden
          check_one fib-mac examples/basics/fib.golden
          check_one float_arith-mac examples/basics/float_arith.golden
          check_one yield-mac examples/concurrency/yield.golden
          check_one sleep-mac examples/io/sleep.golden
          check_one pipeline-mac examples/concurrency/pipeline.golden

  runtime:
    needs: []
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Compile runtime (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: cl /nologo /W3 /c runtime\burrt_impl.c runtime\burrt_natives.c

      - name: Compile runtime (clang)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cc --version | head -n 1
          cc -c runtime/burrt_impl.c runtime/burrt_natives.c

  # This job name is the required status check anchor for main branch protection:
  # required checks match by context name, so renaming or deleting this job leaves
  # every PR into main stuck at "Expected — Waiting for status to be reported".
  # main has enforce_admins on, so the owner cannot unblock it in the UI either;
  # only removing the required check via API recovers.
  # 该 job 名是 main 分支保护 required status check 的锚点：required check 按
  # context 名匹配，改名或删除会让所有进 main 的 PR 卡在
  # "Expected — Waiting for status to be reported"；main 开了 enforce_admins，
  # 届时 owner 在 UI 上也解不开，只能发 API 摘掉该 required check。
  gate:
    needs:
      [gohost, seed, bur-base, gen1, check, fixpoint, testdata, examples, std,
       multibackend, x86-repro, x86-pe-build, x86-pe-run, x86-macho-build,
        x86-macho-run, runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every job reported success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<< "$RESULTS"
          # Every job but seed runs unconditionally, so anything short of
          # success means the chain broke; seed alone is bypassed on a
          # bur-base cache hit. Without this a failed bur-base skips the whole
          # verification chain, and skipped required checks count as passing.
          # 除 seed 外每个 job 都无条件运行，非 success 即链断；seed 只在
          # bur-base cache 命中时被绕过。没有这一条，bur-base 失败会让整条
          # 验证链跳过，而被跳过的 required check 算通过。
          failed=$(jq -r '
            to_entries[]
            | select(.value.result != "success")
            | select(.key != "seed" or .value.result != "skipped")
            | "\(.key)=\(.value.result)"' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "gate: these jobs did not pass:" >&2
            echo "$failed" >&2
            exit 1
          fi
