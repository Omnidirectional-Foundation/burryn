# TEMPORARY DEBUG PROBE — DELETE AFTER USE. Dumps macOS struct stat layout
# ground truth (st_size offset) for the x86 Mach-O fstat arm. Does not touch
# ci.yml or the gate.
name: probe-stat
on: workflow_dispatch
jobs:
  stat-layout:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - name: Dump struct stat offsets
        run: |
          sysroot=$(xcrun --show-sdk-path 2>/dev/null || echo /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk)
          echo "sysroot=$sysroot"
          grep -n "st_size\|st_blocks\|st_birthtimespec\|st_rdev" "$sysroot/usr/include/sys/stat.h" | head -20
      - name: Compile and run offsetof probe
        run: |
          cat > /tmp/statoff.c <<'EOF'
          #include <stdio.h>
          #include <stddef.h>
          #include <sys/stat.h>
          int main(void) {
              printf("sizeof=%zu dev=%zu mode=%zu nlink=%zu ino=%zu uid=%zu gid=%zu\n",
                  sizeof(struct stat), offsetof(struct stat, st_dev),
                  offsetof(struct stat, st_mode), offsetof(struct stat, st_nlink),
                  offsetof(struct stat, st_ino), offsetof(struct stat, st_uid),
                  offsetof(struct stat, st_gid));
              printf("atime=%zu mtime=%zu ctime=%zu birth=%zu size=%zu blocks=%zu blksize=%zu\n",
                  offsetof(struct stat, st_atimespec), offsetof(struct stat, st_mtimespec),
                  offsetof(struct stat, st_ctimespec), offsetof(struct stat, st_birthtimespec),
                  offsetof(struct stat, st_size), offsetof(struct stat, st_blocks),
                  offsetof(struct stat, st_blksize));
              printf("SYS_open=5(close 6,read 3) fstat=189 stat=188 getdirentries64=344 assumed\n");
              return 0;
          }
          EOF
          cc -o /tmp/statoff /tmp/statoff.c && /tmp/statoff
